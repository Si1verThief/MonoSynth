[package]
name = "monosynth"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Monophonic acid synth that sounds like FL Studio's classic TS404"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
ts404-core = { path = "../ts404-core" }
nice-plug = { version = "0.4.2", features = ["assert_process_allocs"] }
nice-plug-egui = "0.5.1"
egui = { version = "0.36.1", features = ["default_fonts"] }
serde = { version = "1", features = ["derive"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[features]
standalone = ["nice-plug/standalone"]

[[bin]]
name = "monosynth-standalone"
path = "src/main.rs"
required-features = ["standalone"]
